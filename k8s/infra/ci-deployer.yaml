# The identity CI deploys with (ADR-0027). It can roll out the app tree and run
# migration Jobs in this namespace and nothing else: no cluster scope, no
# Secret reads. That stops accidents, not a compromised CI: a role that can
# create Jobs can mount a Secret into one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: bus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: bus
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: bus
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: bus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
---
# A long-lived token for the GitHub Actions secret. Rotate by deleting this
# Secret; Kubernetes issues a new token into it.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: bus
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
