syntax = "proto3";
option go_package = "github.com/jnjkhjlkjhb8/wheres_the_bus/models";
service Thsr_timetable_service{
  rpc fare(Ask_Thsr) returns (thsa_fares) {}
  rpc timetable(Ask_Thsr) returns (thsr_timetables) {}
  rpc available_seats(Ask_Thsr) returns (stream Resp_thsr_seats) {}
  rpc station_board(thsr_ask_station_board) returns (thsr_station_board) {}
}
// THSR's half of the station departure board. Shaped like tra_station_board
// but declared separately: the two protos share no imports, matching how
// every other rail message in this repo is duplicated per system.
message thsr_ask_station_board{
  string station_id = 1;
  string date = 2;
  // Lower bound on departure time, `HH:mm:ss`, from the caller's clock. Empty
  // means the whole day.
  string after = 3;
  // 0 南下 / 1 北上.
  int32 direction = 4;
  // Departures to return. 0 means the default (20); the router caps it.
  int32 limit = 5;
}
message thsr_station_board{
  repeated thsr_station_departure items = 1;
}
message thsr_station_departure{
  string TrainDate = 1;
  string TrainNo = 2;
  string Destination_Station_Name = 3;
  string DepartureTime = 4;
  int32 Direction = 5;
  string Note = 6;
}
service Thsr_Detain_service{
  rpc stops(thsr_ask_detain) returns (thsr_stoptimes) {}
}
message thsr_ask_detain{
  string date = 1;
  string trainno = 2;
}
message thsr_timetables{
  repeated thsa_timetable items = 1;
}
message thsr_stoptimes{
  repeated thsa_stoptime items = 1;
}
message Resp_Data{
  bytes data = 1;
}
message Ask_Thsr{
  string date = 1;
  string origin_station_id = 2;
  string destination_station_id = 3;
}
message thsa_fare {
  string origin_station_id = 1;
  string destination_station_id = 2;
  int32 ticket_type = 3;
  int32 fare_class = 4;
  int32 cabin_clas = 5;
  int32 price = 6;
}
message thsa_fares {
  repeated thsa_fare items = 1;
}
message thsa_stoptime{
  int32 stop_sequence = 3;
  string station_id = 1;
  string station_name = 2;
  string ArrivalTime = 4;
  string DepartureTime = 5;
}
message thsa_timetable{
  string TrainDate = 1;
  string TrainNo = 2;
  int32 Direction = 3;
  string Starting_Station_ID = 4;
  string Starting_Station_Name = 5;
  string EndingStationID = 6;
  string EndingStationName = 7;
  string Note = 8;
  bool Overnight = 9;
  string Starting_Time = 12;
  string Ending_Time = 13;
  string Travel_Time = 14;
}
message thsr_seat_segment {
  string origin_station_id = 1;
  string destination_station_id = 2;
  string standard_seat_status = 3;
  string business_seat_status = 4;
}
message thsr_available_seats {
  string train_no = 1;
  repeated thsr_seat_segment segments = 3;
}
// Wire-compatible with the former `bytes data = 1`: field 1 still carries a
// marshaled thsr_available_seats, now typed for the interface.
message Resp_thsr_seats {
  thsr_available_seats data = 1;
}
