name: deploy

# Every main merge that passes ci and build-images rolls out to the k3s cluster
# with no approval step (ADR-0027). The repository variable K3S_DEPLOY_ENABLED
# stays unset until the operator has bootstrapped the cluster's last-known-good
# snapshot (scripts/k3s-deploy.sh bootstrap).
on:
  workflow_run:
    workflows: [build-images]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A manual build-images run is not a main merge; only one triggered by
    # this repository's ci on main deploys.
    if: >-
      vars.K3S_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: check release manifest and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          commit=$(jq -r .commit release-manifest.json)
          if [ "$commit" != "$HEAD_SHA" ]; then
            echo "::error::release manifest is for $commit, not $HEAD_SHA" >&2
            exit 1
          fi
          for ref in $(jq -r '.images[]' release-manifest.json); do
            gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY"
          done
      - name: join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: kubeconfig (ci-deployer)
        env:
          K3S_SERVER: ${{ secrets.K3S_SERVER }}
          K3S_CA_DATA: ${{ secrets.K3S_CA_DATA }}
          K3S_DEPLOY_TOKEN: ${{ secrets.K3S_DEPLOY_TOKEN }}
        run: |
          umask 077
          mkdir -p ~/.kube
          printf '%s' "$K3S_CA_DATA" | base64 -d > ~/.kube/ca.crt
          kubectl config set-cluster home --server="$K3S_SERVER" --certificate-authority="$HOME/.kube/ca.crt"
          kubectl config set-credentials ci-deployer --token="$K3S_DEPLOY_TOKEN"
          kubectl config set-context ci --cluster=home --user=ci-deployer --namespace=bus
          kubectl config use-context ci
          kubectl get deployment -n bus >/dev/null
      - name: migrate, roll out, smoke test (rolls back on failure)
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: ./scripts/k3s-deploy.sh deploy release-manifest.json
      - name: keep the last-known-good snapshot
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: last-known-good
          path: |
            k8s/.release/manifests.yaml
            release-manifest.json
          retention-days: 90
