services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bus_test
      POSTGRES_USER: bus
      POSTGRES_PASSWORD: bus
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus -d bus_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  router:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  functions:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  rider-worker:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  pipeline:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy


  powersync:
    profiles: ["sync"]

volumes:
  postgres_test_data:
