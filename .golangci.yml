version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gocritic
    - intrange
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1005
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - errorlint

formatters:
  enable:
    - gofmt
