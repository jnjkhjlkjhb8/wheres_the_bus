syntax = "proto3";
option go_package = "github.com/jnjkhjlkjhb8/wheres_the_bus/models";
service TRA_timetable_service{
  rpc timetable(ask_route) returns (tra_timetables) {}
  rpc fare(ask_staiton) returns (tra_fare_items) {}
  rpc delay(ask_route) returns (stream Resp_tra_delay) {}
  rpc station_board(ask_station_board) returns (tra_station_board) {}
}
// A station's next departures in one direction — the board a rider gets by
// tapping the station on the map, with no destination to pick.
message ask_station_board{
  // Numeric station id or a station name; the router resolves names the same
  // 臺/台-tolerant way it does for the O/D RPCs.
  string station_id = 1;
  string date = 2;
  // Lower bound on departure time, `HH:mm:ss`. The caller sends its own clock
  // rather than the server reading one: the router runs in UTC and the rider
  // is in Asia/Taipei. Empty means the whole day.
  string after = 3;
  // 0 順行 / 1 逆行.
  int32 direction = 4;
  // Departures to return. 0 means the default (20); the router caps it.
  int32 limit = 5;
}
message tra_station_board{
  repeated tra_station_departure items = 1;
}
message tra_station_departure{
  // The service date this departure runs on, which is not always the date
  // asked for: a board opened near midnight is topped up from the next day.
  string TrainDate = 1;
  string TrainNo = 2;
  string TrainTypeCode = 3;
  string TrainTypeName = 4;
  string Destination_Station_Name = 5;
  string DepartureTime = 6;
  int32 Direction = 7;
  int32 mask = 8;
  string Note = 9;
}
service TRA_Detain_service{
  rpc stops(ask_detain) returns (tra_stoptimes) {}
  rpc delay(ask_detain) returns (stream Resp_tra_delay) {}
}
// Wire-compatible with the former `bytes data = 1`: field 1 still carries a
// marshaled tra_delays (both the system-wide and per-train delay RPCs).
message Resp_tra_delay{
  tra_delays data = 1;
}
message ask_detain{
  string date = 1;
  string trainno = 2;
}
message ask_route{
  string date = 1;
  string origin_station_id = 2;
  string destination_station_id = 3;
}
message ask_staiton{
  string station_id = 1;
  string date = 2;
}
message TraFareItem {
  string origin_station_id = 1;
  string destination_station_id = 2;
  string ticket_type = 3;
  int32 price = 4;
}
message tra_fare_items {
  repeated TraFareItem items = 1;
}
message tra_timetables{
  repeated tra_timetable items = 1;
}
message tra_stoptimes{
  repeated tra_stoptime items = 1;
}
message tra_delays {
  map<string, int32> delay = 1;
}
message tra_stoptime{
  int32 stop_sequence = 3;
  string station_id = 1;
  string station_name = 2;
  string ArrivalTime = 4;
  string DepartureTime = 5;
  bool SuspendedFlag = 6;
}
message tra_timetable{
  string TrainDate = 1;
  string TrainNo = 2;
  int32 Direction = 3;
  string Starting_Station_Name = 4;
  string Ending_Station_Name = 5;
  string TrainTypeID = 6;
  string TrainTypeCode = 7;
  string TrainTypeName = 8;
  int32 TripLine = 9;
  int32 mask = 10;
  string Note = 11;
  string Starting_Time = 12;
  string Ending_Time = 13;
  string Travel_Time = 14;
}
message tra_delay{
  string train_no = 1;
  string station_id = 2;
  int32 delay = 3;
}
