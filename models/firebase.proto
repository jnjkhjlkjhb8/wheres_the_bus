syntax = "proto3";

option go_package = "github.com/jnjkhjlkjhb8/wheres_the_bus/models";

service Firebase_Service {
  rpc upsertDevice(UpsertDeviceRequest) returns (DeviceState) {}
  rpc replaceRouteSubscriptions(RouteSubscriptionsRequest) returns (Ack) {}
  rpc createArrivalReminder(CreateArrivalReminderRequest) returns (ArrivalReminder) {}
  rpc cancelArrivalReminder(CancelArrivalReminderRequest) returns (Ack) {}
  rpc listDeviceState(DeviceRequest) returns (DeviceState) {}
}

message Ack {
  bool ok = 1;
  string message = 2;
}

message DeviceIdentity {
  string install_id = 1;
  string fcm_token = 2;
  string platform = 3;
  string app_version = 4;
}

// Push is the only device preference the rider controls. Analytics, crash and
// performance collection are always on, so they are not carried here.
message DevicePrefs {
  bool push_enabled = 1;
  reserved 2, 3, 4;
  reserved "analytics_enabled", "crashlytics_enabled", "performance_enabled";
}

message UpsertDeviceRequest {
  DeviceIdentity identity = 1;
  DevicePrefs prefs = 2;
}

message DeviceRequest {
  string install_id = 1;
}

message DeviceState {
  DeviceIdentity identity = 1;
  DevicePrefs prefs = 2;
}

// One route identity a device's 收藏 resolves to. route_key "*" is the
// line-wide marker a rail-station 收藏 produces: it matches no real alert
// scope, so it receives only system-wide disruptions.
message RouteSubscription {
  string route_type = 1;
  string route_key = 2;
}

// The device's whole 訂閱範圍, replacing whatever was stored. Sending an empty
// list unsubscribes the device from everything.
message RouteSubscriptionsRequest {
  string install_id = 1;
  repeated RouteSubscription subscriptions = 2;
}

message CreateArrivalReminderRequest {
  string install_id = 1;
  string route_type = 2;
  string route_key = 3;
  string stop_key = 4;
  string direction = 5;
  int32 lead_minutes = 6;
  int64 expires_at_unix = 7;
  // Non-empty pins the reminder to one vehicle: it fires only when this plate
  // is the bus arriving at stop_key. Empty keeps the legacy next-bus behaviour.
  string plate = 8;
  string alight_event = 9;
}

message ArrivalReminder {
  string reminder_id = 1;
  string install_id = 2;
  string route_type = 3;
  string route_key = 4;
  string stop_key = 5;
  string direction = 6;
  int32 lead_minutes = 7;
  int64 expires_at_unix = 8;
  string plate = 9;
}

message CancelArrivalReminderRequest {
  string reminder_id = 1;
  string install_id = 2;
}
