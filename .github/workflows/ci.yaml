name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips jobs at job level, not with `on.push.paths`: build-images runs on
  # this workflow's success, so a filtered-out workflow would silently skip the
  # deploy. A skipped job still leaves the run green.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.diff.outputs.go }}
      flutter: ${{ steps.diff.outputs.flutter }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # On main, diff against the last green push run, not github.event.before:
      # a run that was cancelled (cancel-in-progress) or went red in between
      # would otherwise drop its changes from the diff, and this run's success
      # would deploy them untested.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then
            base=$(gh run list --workflow ci.yaml --branch main --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty')
          fi
          ./scripts/ci-changes.sh "$base" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    # Postgres is started as a step, not a service: it is built from
    # docker/postgres (the image the cluster runs), and service containers can
    # only use images that already exist in a registry.
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://bus:bus@localhost:5432/bus_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      REDIS_TEST_ADDR: localhost:6379
      PG_SCHEMA: public
      FIREBASE_ENABLED: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The quality gates diff against the push/PR base commit.
          fetch-depth: 0
      # pg_isready over TCP: the image entrypoint's init server answers on the
      # socket only, then restarts, so a socket probe passes too early.
      - name: start postgres (docker/postgres image)
        run: |
          docker build -q -t bus-postgres:ci docker/postgres
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_DB=bus_test -e POSTGRES_USER=bus -e POSTGRES_PASSWORD=bus \
            bus-postgres:ci
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U bus -d bus_test && break
            sleep 2
          done
          docker exec postgres pg_isready -h 127.0.0.1 -U bus -d bus_test
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: provision required database fixtures
        env:
          REQUIRE_DB_TESTS: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          ./scripts/prepare-ci-db.sh
      - name: generate pinned protobuf stubs
        run: make proto-go
      - run: go install gotest.tools/gotestsum@v1.12.3
      - name: go test
        env:
          GO_JUNIT_FILE: junit.xml
          GO_TEST_ARGS: -coverprofile=coverage.out
          REQUIRE_DB_TESTS: "1"
          BUS_WRITER_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: ./scripts/ci.sh go-test
      - name: quality gates (CRAP + duplication + mutation on changed Go code)
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUIRE_DB_TESTS: "1"
          BUS_WRITER_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: ./scripts/check-quality.sh go
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go
      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          flags: go

  # Its own job so lint runs beside the tests; the action downloads the release
  # binary instead of compiling it, and caches the analysis between runs.
  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: generate pinned protobuf stubs
        run: make proto-go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Same pin as GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.12.2

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # buf breaking diffs the proto contract against the PR base ref,
          # which requires history beyond the merge commit.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: contracts (dependency boundaries, file budgets, proto contract)
        env:
          # Every push to main deploys, so the baseline is what was live before
          # it. A `[proto-break]` head commit skips the breaking check (HEAD vs
          # HEAD); see docs/agents/workflow.md for when that is allowed.
          PROTO_BASELINE_REF: ${{ contains(github.event.head_commit.message, '[proto-break]') && 'HEAD' || github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ci.sh contracts

  migrations:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: migration lint (squawk) + replay gate (baseline + full history)
        run: ./scripts/ci.sh migrations

  # Old code on the new schema: the release running in the cluster (the last
  # successful deploy) must keep working after this change's migrations, since
  # migrations run before the rollout and are never rolled back.
  schema-compat:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://bus:bus@localhost:5432/bus_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      REDIS_TEST_ADDR: localhost:6379
      PG_SCHEMA: public
      FIREBASE_ENABLED: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: find last-known-good commit
        id: lkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # bus-infra's deploy records each successful rollout as a production
          # deployment here; the newest one whose latest status is success is live.
          sha=""
          # Assigned first so an API error fails the job instead of reading as "never deployed".
          deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=20" \
            --jq '.[] | "\(.id):\(.sha)"')
          for d in $deployments; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/${d%%:*}/statuses?per_page=1" --jq '.[0].state // empty')
            if [ "$state" = success ]; then sha="${d#*:}"; break; fi
          done
          if [ -z "$sha" ]; then
            echo "::notice::no successful deploy yet; nothing is live to stay compatible with"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: start postgres (docker/postgres image)
        if: steps.lkg.outputs.sha != ''
        run: |
          docker build -q -t bus-postgres:ci docker/postgres
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_DB=bus_test -e POSTGRES_USER=bus -e POSTGRES_PASSWORD=bus \
            bus-postgres:ci
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U bus -d bus_test && break
            sleep 2
          done
          docker exec postgres pg_isready -h 127.0.0.1 -U bus -d bus_test
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.lkg.outputs.sha != ''
        with:
          go-version-file: go.mod
      - name: apply this change's migrations
        if: steps.lkg.outputs.sha != ''
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client protobuf-compiler
          ./scripts/prepare-ci-db.sh
      - name: run the last-known-good release's DB tests
        if: steps.lkg.outputs.sha != ''
        env:
          LKG_SHA: ${{ steps.lkg.outputs.sha }}
          REQUIRE_DB_TESTS: "1"
          BUS_WRITER_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          git worktree add "$RUNNER_TEMP/lkg" "$LKG_SHA"
          cd "$RUNNER_TEMP/lkg"
          make proto-go
          go test ./...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # gitleaks scans commit history, not just the checkout tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo-root .gitleaks.toml (default rules + reviewed non-secret
          # allowlists) is auto-detected by gitleaks.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: generate pinned protobuf stubs
        run: make proto-go
      # Independent job (not a step after go test) specifically so a red
      # `go` job can never cause these SCA/guardrail gates to be skipped
      # (review_results.md P0-03).
      - name: govulncheck (pinned SCA gate)
        run: ./scripts/check-govulncheck.sh

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with --total-shards below.
        shard: [0, 1, 2, 3]
    name: flutter (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Exact version (not `channel: stable`) so a channel promotion
          # upstream cannot silently change the toolchain a green run was
          # tested against. Track app/pubspec.yaml's Dart SDK constraint
          # (environment.sdk) when bumping.
          flutter-version: 3.44.1
          cache: true
      - run: dart pub global activate protoc_plugin 25.0.0
      - run: dart pub global activate junitreport 2.0.2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      # Bundled app/assets are tracked; the metro maps and rail service marks
      # are served by the router (FDPL-125), so a clean checkout lacks them and
      # the tests seed RemoteAssets instead.
      - name: flutter test
        env:
          FLUTTER_TEST_ARGS: --coverage --file-reporter=json:test-results.json --total-shards 4 --shard-index ${{ matrix.shard }}
        run: ./scripts/ci.sh flutter-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-lcov-${{ matrix.shard }}
          path: app/coverage/lcov.info
          retention-days: 1
      - run: tojunit --input test-results.json --output junit.xml
        if: ${{ !cancelled() && hashFiles('app/test-results.json') != '' }}
        working-directory: app
      # Codecov merges the shards' uploads of one commit.
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: ${{ !cancelled() && hashFiles('app/coverage/lcov.info') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/lcov.info
          flags: flutter
      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        if: ${{ !cancelled() && hashFiles('app/junit.xml') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/junit.xml
          flags: flutter

  # The quality gates need the coverage of every shard, so they wait for all
  # four and merge it. Analyze rides along to save a fifth toolchain setup.
  flutter-quality:
    needs: [changes, flutter]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The quality gates diff against the push/PR base commit.
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          cache: true
      - run: dart pub global activate protoc_plugin 25.0.0
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: flutter analyze
        run: ./scripts/ci.sh flutter-analyze
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flutter-lcov-*
          path: ${{ runner.temp }}/lcov
      - name: merge shard coverage
        run: |
          mkdir -p app/coverage
          python3 scripts/quality-changed.py merge-lcov app/coverage/lcov.info "$RUNNER_TEMP"/lcov/*/lcov.info
      - name: quality gates (CRAP + mutation on changed Dart code)
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-quality.sh flutter
