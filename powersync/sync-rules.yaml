bucket_definitions:
  global:
    data:
      - SELECT
            id,
            from_station_id,
            to_station_id,
            system,
            fare_nt,
            half_fare_nt,
            travel_time_min
          FROM mrt_journey_matrix
      - SELECT
            station_id || ':' || lineid || ':' || destinationstaionid || ':' || serviceday || ':' || system AS id,
            station_id,
            lineid,
            destinationstaionid,
            serviceday,
            system,
            firsttraintime AS first_train_time,
            lasttraintime AS last_train_time
          FROM mrt_schedule
