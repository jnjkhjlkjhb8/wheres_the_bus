# Operator-applied infrastructure (ADR-0027). It reads config files that live
# outside this directory, so render with the load restrictor off:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/infra | kubectl apply -f -
#   scripts/k3s-secrets.sh apply
# The CI deploy role cannot change anything here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base.yaml
  - cert-manager.yaml
  - postgres.yaml
  - services.yaml
  - networkpolicy.yaml
  - ci-deployer.yaml
  - db-alerts.yaml
configMapGenerator:
  - name: db-alerts-script
    namespace: bus
    files:
      - check.sh=db-alerts/check.sh
  - name: postgres-hba
    namespace: bus
    files:
      - pg_hba.conf=postgres/pg_hba.conf
  - name: powersync-sync-rules
    namespace: bus
    files:
      - sync-rules.yaml=../../powersync/sync-rules.yaml
  # The tunnel id is public; its credentials are the cloudflared Secret.
  - name: cloudflared-tunnel
    namespace: bus
    literals:
      - id=75282106-76dd-4898-a8e2-1f700c92066f
images:
  # Pin to the digest build-images publishes before applying.
  - name: ghcr.io/jnjkhjlkjhb8/bus-postgres
    digest: sha256:e5d1341ed0f6fbbfff7fd9a41cae73f4dc2fefb9f148452d065a33acd7956002
