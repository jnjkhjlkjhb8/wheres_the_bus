syntax = "proto3";
option go_package = "github.com/jnjkhjlkjhb8/wheres_the_bus/models";
service Bus_Route_Service{
  rpc static(Bus_Ask_Route) returns (Resp_Bus_static) {}
  rpc daily(Bus_Ask_Route) returns (Resp_Bus_daily_timetable) {}
  rpc eta(Bus_Ask_Route) returns (stream Resp_Bus_eta) {}
}
service Bus_Station_Service{
  rpc eta(Bus_Ask_StationGroup) returns (stream Resp_Bus_station_eta) {}
  rpc group(Bus_Ask_StationGroup) returns (Bus_StationGroup) {}
}
message Bus_Ask_Route {
  string SubRouteUID = 1;
}
message Bus_Ask_StationGroup {
  string city = 1;
  string group_uid = 2;
}
message Bus_Ask_Station {
  string StationName = 1;
  string city = 2;
}
// Wire-compatible with the former `bytes data = 1`: a length-delimited field 1
// still carries a marshaled Bus_subroute, now typed for the interface.
message Resp_Bus_static{
  Bus_subroute data = 1;
}
// Route ETA envelope. data is a Bus_RouteArrival (Bus_Route_Service.eta).
message Resp_Bus_eta{
  Bus_RouteArrival data = 1;
}
// Station-group ETA envelope. data is a Bus_StationArrival
// (Bus_Station_Service.eta). Split from Resp_Bus_eta so each RPC carries its
// own payload schema.
message Resp_Bus_station_eta{
  Bus_StationArrival data = 1;
}
message Resp_Bus_daily_timetable{
  Bus_DailyTimetables data = 1;
}
message BusOperator {
  string operator_id    = 1;
  string operator_name  = 2;
  string operator_phone = 3;
  string operator_url   = 4;
}
message Bus_subroute{
  string RouteUID = 1;
  string RouteName = 2;
  string SubRouteUID = 3;
  string SubRouteName = 4;
  string DepartureStopName = 5;
  string DestinationStopName = 6;
  string city = 7;
  map<int32,Direction> Directions = 8;
  repeated BusOperator operators = 9;
  Bus_Fare fare = 10;
}

message Direction{
  string DepartureStopName = 1;
  string DestinationStopName = 2;
  string Geometry = 3;
  repeated Bus_stop Stops = 4;
  repeated Bus_Schedule Schedules = 5;
  string first_bus_time = 6;
  string last_bus_time = 7;
  string holiday_first_bus_time = 8;
  string holiday_last_bus_time = 9;
}

message Bus_stop{
  string StopUID = 1;
  string StopName = 2;
  int32 StopSequence = 3;
  double PositionLon = 4;
  double PositionLat = 5;
  string StationID = 6;
}

message RouteOfStop{
  reserved 1;
  string SubRouteUID = 2;
  int32 Direction = 3;
  repeated Bus_stop Stops = 4;
}

message Shape{
  string SubRouteUID = 1;
  int32 Direction = 2;
  string Geometry = 3;
}

message Station{
  string StationUID = 1;
  string StationName = 2;
  string city = 3;
  double PositionLon = 4;
  double PositionLat = 5;
}
message Bus_StationGroup{
  string group_uid = 1;
  string group_name = 2;
  string city = 3;
  double position_lon = 4;
  double position_lat = 5;
  repeated Bus_StationGroupMember members = 6;
}
message Bus_StationGroupMember{
  string station_uid = 1;
  string station_id = 2;
  string station_name = 3;
  double position_lon = 4;
  double position_lat = 5;
}

message Bus_RouteArrival{
  reserved 2;
  string sub_route_uid = 1;
  repeated Bus_RouteEstimate stops = 3;
}
message Bus_StationArrival{
  string station_name = 1;
  repeated string station_uid = 2;
  repeated Bus_StopEstimate routes = 3;
}
message Bus_RouteEstimate{
  string stop_uid = 1;
  int32 direction = 2;
  int32 estimate = 3;
  string NextBusTime = 4;
  int32 Stop_status = 5;
  string src_update_time = 6;
  repeated Bus_position Buses = 7;
  int32 StopSequence = 8;
  int64 arrival_unix = 9;
  string plate_numb = 10;
  // Crowding of the vehicle this estimate describes, resolved server-side from
  // plate_numb so the client never has to join Buses itself.
  BusCrowdLevel crowd_level = 11;
  bool is_last_bus = 12;
}
message Bus_StopEstimate{
  string stop_uid = 1;
  string sub_route_uid = 2;
  string route_name = 3;
  int32 Direction = 4;
  int32 estimate = 5;
  string NextBusTime = 6;
  int32 Stop_status = 7;
  string src_update_time = 8;
  repeated Bus_position Buses = 9;
  int64 arrival_unix = 10;
  string destination = 11;
  BusCrowdLevel crowd_level = 12;
  bool is_last_bus = 13;
}
enum BusCrowdLevel {
  BUS_CROWD_UNKNOWN = 0;
  BUS_CROWD_COMFORTABLE = 1;
  BUS_CROWD_NORMAL = 2;
  BUS_CROWD_CROWDED = 3;
}
message Bus_position{
  reserved 6, 7, 8;
  reserved "DutyStatus", "BusStatus", "gps_time";
  string plate_numb = 1;
  double position_lon = 2;
  double position_lat = 3;
  int32 speed = 4;
  int32 azimuth = 5;
  int32 duty_status = 9;
  int32 bus_status = 10;
  int64 gps_time_unix = 11;
  BusCrowdLevel crowd_level = 12;
}
message Bus_Schedule {
  bool is_timetable = 1;
  string tripid = 2;
  bool islowfloor = 3;
  string start_Time = 4;
  string end_Time = 5;
  string MinHeadwayMins_arrival_time = 6;
  string MaxHeadwayMins_departure_time = 7;
  int32 service_day = 8;
}
message Bus_DailyTimetables{
  reserved 2;
  string SubRouteUID = 1;
  map<int32,Bus_DirectionTimetable> direction = 3;
}
message Bus_DirectionTimetable{
  repeated Bus_DailyTimetable DailyTimetables = 1;
}
message Bus_DailyTimetable{
  string TripID = 1;
  bool IsLowFloor = 2;
  repeated Bus_StopTime StopTimes = 3;
}
message Bus_StopTime{
  int32 StopSequence = 1;
  string ArrivalTime = 2;
  string DepartureTime = 3;
  string StopUID = 4;
}
message Bus_Fare {
  reserved 1;
  reserved "sub_route_uid";
  int32 fare_pricing_type = 2;
  bool is_free_bus = 3;
  bytes section_fares_json = 4;
  bytes stage_fares_json = 5;
  bytes od_fares_json = 6;
}
