name: app-android-beta

# An app-v<x.y.z> tag asks the private bus-infra repo to build the signed beta
# APK (its app-android-beta.yaml). The signing key and the staging env stay
# there, out of this public repo.
on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: send to bus-infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          # UpdateGate compares numeric x.y.z only, and min_supported_version
          # is 0.1.0, so 0.0.x would open on the force-update screen.
          if ! [[ "$GITHUB_REF_NAME" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$GITHUB_REF_NAME" == app-v0.0.* ]]; then
            echo "::error::tag must be app-vX.Y.Z >= 0.1.0, got $GITHUB_REF_NAME"
            exit 1
          fi
          jq -n --arg tag "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            '{event_type: "app-android-beta", client_payload: {tag: $tag, sha: $sha}}' \
            | gh api "repos/$GITHUB_REPOSITORY_OWNER/bus-infra/dispatches" --input -
